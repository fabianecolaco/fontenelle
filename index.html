<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Fabiane Colaço Ferreira">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pluralidade dos Mundos</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Conceito: um slide 4:3 como uma prancha gravada. O palco ocupa o alto do quadro, a fala corre embaixo
   como legenda e os desafios se abrem sobre a cena. Tudo escala com o quadro (unidades cqw/em). Visual noturno único. */
:root{
  --deep:#05080f; --night:#0b1328; --night-2:#121d3a; --panel:#16234a; --line:#2c3b68;
  --moon:#ece6d3; --muted:#aab4d0; --gold:#d9b25f; --gold-2:#f0d08a; --rose:#f0aca4; --sky:#a3c8ec;
  --display:"IM Fell English","Palatino Linotype",Georgia,serif;
  --talk:"EB Garamond",Garamond,Georgia,serif;
  --ui:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--deep);color:var(--moon);font:16px/1.5 var(--ui)}
#app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
#app:fullscreen{padding:0;background:var(--deep)}
.frame{position:relative;width:min(100%,calc((100dvh - 32px)*4/3));aspect-ratio:4/3;container-type:inline-size;overflow:hidden;border-radius:6px;background:var(--night);box-shadow:0 20px 60px rgba(0,0,0,.5)}
#app:fullscreen .frame{width:min(100vw,calc(100vh*4/3));border-radius:0;box-shadow:none}
.sl{position:absolute;inset:0;font-size:1.6cqw;line-height:1.45;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.12;text-wrap:balance}
p{margin:0}
.eyebrow{font:800 .7em/1.2 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-2)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}
.btn{border:0;border-radius:.3em;background:var(--gold);color:#1c1405;font-weight:800;padding:.65em 1.2em;font-size:.95em;white-space:nowrap}
.btn:hover{background:var(--gold-2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--muted);color:var(--moon)}
.link{background:none;border:0;padding:.3em 0;font-weight:700;color:var(--gold-2);text-decoration:underline;font-size:.9em}
.row{display:flex;flex-wrap:wrap;gap:.7em;align-items:center}
.rot{display:none;font-size:.9rem;color:var(--muted);text-align:center}
@media (orientation:portrait) and (max-width:700px){.rot{display:block}}
/* fundo */
.bg{position:absolute;inset:0}
.bg svg{width:100%;height:100%;display:block}
.bg.dim::after{content:"";position:absolute;inset:0;background:rgba(8,13,28,.86)}
.pg{position:relative;height:100%;padding:1.6em 2.2em;display:flex;flex-direction:column;gap:.8em}
/* abertura */
.openp{position:absolute;inset:0 auto 0 0;width:60%;padding:2em 2.2em;display:flex;flex-direction:column;justify-content:center;gap:.75em;background:linear-gradient(90deg,rgba(8,13,28,.97) 72%,rgba(8,13,28,0))}
.openp h1{font-size:2.5em}
.prose{font:1em/1.45 var(--talk);display:flex;flex-direction:column;gap:.45em}
.fsb{position:absolute;top:.8em;right:1.2em}
.by{font-size:.8em;color:var(--muted)}
.by b{color:var(--moon);font-weight:700}
/* menu */
.pg h1{font-size:2.3em}
.nights{display:grid;grid-template-columns:repeat(3,1fr);gap:.7em}
.night{text-align:left;background:var(--night-2);border:1.5px solid var(--line);border-radius:.35em;padding:.8em .9em;display:flex;flex-direction:column;gap:.25em;min-height:7.2em}
.night:hover:not(:disabled){border-color:var(--gold)}
.night:disabled{cursor:default;opacity:.5}
.night h3{font-size:1.15em}
.night .st{margin-top:auto;font-size:.75em;font-weight:700;color:var(--muted)}
.night .st.done{color:var(--gold-2)}
.small{font-size:.78em;color:var(--muted)}
/* noite */
.stagebox{position:relative;width:100%;aspect-ratio:1000/560;flex:none}
.stage{position:absolute;inset:0;background:var(--deep)}
.stage svg,.stage canvas{width:100%;height:100%;display:block}
.topbar{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.5em 1em 1.6em;background:linear-gradient(rgba(5,8,15,.8),rgba(5,8,15,0));font-size:.85em}
.tt{font-weight:700;color:var(--moon);text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;gap:1em;align-items:center}
.spd{display:inline-flex;gap:.3em;align-items:center}
.spd button{min-width:2.6em;padding:.2em .45em;border:1.5px solid var(--gold);border-radius:.25em;background:rgba(5,8,15,.55);color:var(--gold-2);font-weight:800;font-size:.85em;line-height:1.3}
.spd button[aria-pressed="true"]{background:var(--gold);color:#1c1405}
.spd button:hover{background:rgba(217,178,95,.25)}
.spd button[aria-pressed="true"]:hover{background:var(--gold-2)}
.dots{display:inline-flex;gap:.3em;vertical-align:middle;margin-right:.6em}
.dots i{width:1.2em;height:.22em;border-radius:1em;background:var(--line)}
.dots i.on{background:var(--gold)}
.seg{position:absolute;top:2.7em;right:1em;display:flex;gap:.4em;font-size:.85em}
.seg button{background:rgba(11,19,40,.85);border:1.5px solid var(--line);border-radius:.3em;padding:.45em .8em;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-2)}
.leg{position:absolute;bottom:.6em;font-size:.72em;background:rgba(5,8,15,.8);padding:.3em .6em;border-radius:.3em;color:var(--muted)}
.leg b{color:var(--moon)}
.leg.l{left:1em}.leg.r{left:51%}
.band{flex:1;min-height:0;display:grid;grid-template-columns:1fr auto;gap:1.2em;align-items:center;padding:.8em 1.6em;border-top:1px solid var(--line);background:var(--night)}
.bc{display:flex;flex-direction:column;gap:.25em;min-width:0}
.who{font:800 .68em/1.2 var(--ui);letter-spacing:.1em;text-transform:uppercase}
.who.M{color:var(--rose)}.who.F{color:var(--sky)}.who.Q{color:var(--gold-2)}
.txt{font:1.22em/1.38 var(--talk)}
.txt.cap{font-style:italic;color:var(--muted)}
.txt.qt{font-style:italic}
.prev{font:italic .95em/1.35 var(--talk);color:var(--muted)}
cite{font-style:normal;font-size:.7em;color:var(--muted)}
.act{align-self:flex-start;background:transparent;border:1.5px dashed var(--gold);color:var(--gold-2);border-radius:.3em;padding:.55em 1em;font-weight:800;margin-top:.3em}
.act:hover{background:rgba(217,178,95,.12)}
/* desafio */
.scrim{position:absolute;inset:0;background:rgba(5,8,15,.78);display:grid;place-items:center;padding:2em 3em}
.chal{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:.4em;padding:1.3em 1.5em;display:flex;flex-direction:column;gap:.7em}
.chal h3{font-size:1.4em}
.opts{display:flex;flex-direction:column;gap:.45em}
.opt{display:grid;grid-template-columns:1.8em 1fr;gap:.4em;text-align:left;background:var(--night-2);border:1.5px solid var(--line);border-radius:.3em;padding:.55em .75em;font-weight:600;font-size:.95em}
.opt span{font-weight:800;color:var(--gold-2)}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:disabled{cursor:default;opacity:.5}
.opt.pick{opacity:1;border-color:var(--gold)}
.verdict{font-size:.8em;color:var(--muted)}
.expl{border-top:1px solid var(--line);padding-top:.6em;display:flex;flex-direction:column;gap:.25em}
.expl b{font:800 .68em/1.3 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--sky)}
.expl p{font:1.08em/1.4 var(--talk)}
/* fim */
table{border-collapse:collapse;width:100%;font-size:.85em}
th,td{text-align:left;padding:.45em .6em;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
td.c{text-align:center;font-weight:800}
/* animações */
.tw{animation:tw 3s infinite alternate ease-in-out}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.fly{animation:fly 5s infinite ease-in-out;transform-box:view-box}
@keyframes fly{0%,100%{transform:translate(0,0)}50%{transform:translate(46px,-26px)}}
.sail{animation:sail 17s infinite linear;animation-delay:-7s;transform-box:view-box}
@keyframes sail{from{transform:translateX(-320px)}to{transform:translateX(1120px)}}
.pass{animation:pass 6s infinite linear;transform-box:view-box}
@keyframes pass{from{transform:translateX(0)}to{transform:translateX(-340px)}}
.flame{animation:fl 1.2s infinite alternate ease-in-out;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scaleY(1)}to{transform:scaleY(1.18)}}
.bob{animation:bob 3s infinite alternate ease-in-out;transform-box:view-box}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(4px)}}
.cam .ground,.cam .moon,.cam .stars{transition:transform 4s cubic-bezier(.45,0,.2,1);transform-box:view-box}
.cam .moon{transform-origin:820px 110px}
.cam.rise .ground{transform:translateY(460px)}
.cam.rise .stars{transform:translateY(150px)}
.cam.rise .moon{transform:translate(-320px,170px) scale(2.4)}
.paint{transition:opacity .8s}
@keyframes spin{to{transform:rotate(360deg)}}
.mars-pass{animation:mp 14s linear infinite;transform-box:view-box}
@keyframes mp{from{transform:translateX(-200px)}to{transform:translateX(1000px)}}
.letter{animation:lt 6s ease-in-out infinite;transform-box:view-box}
@keyframes lt{0%{transform:translate(160px,140px)}50%{transform:translate(840px,420px)}100%{transform:translate(160px,140px)}}
.fade{animation:fd 5s ease-in infinite alternate}
@keyframes fd{from{opacity:1}to{opacity:.03}}
.appear{animation:fd 5s ease-in infinite alternate-reverse}
.bloom{animation:bl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bl{0%{transform:scaleY(.1);opacity:.2}35%{transform:scaleY(1);opacity:1}75%{opacity:1}100%{transform:scaleY(.6);opacity:.1}}
.comet{animation:cm 9s linear infinite;transform-box:view-box}
@keyframes cm{from{transform:translate(-120px,60px)}to{transform:translate(1150px,250px)}}
.bands{animation:bd 4s ease-in-out infinite alternate;transform-box:view-box}
@keyframes bd{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
.fin{font:1.02em/1.5 var(--talk);display:flex;flex-direction:column;gap:.5em;max-width:46em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<main id="app"></main>

const L=(w,x)=>({t:'l',w,x}), C=x=>({t:'n',x});

HAVE.forEach(id=>AUDIO[id]=(/^n\d-/.test(id)?id.split('-')[0]:'extra')+'/'+id+'.mp3');
const N1={n:1,title:'O Universo não é o que parece',next:'A Lua poderá ser habitada?',scenes:[
 {id:'n1s1',t:'Uma conversa sob as estrelas',stage:'garden',steps:[
  C('O jardim da marquesa, ao anoitecer. A casa iluminada ao fundo.'),
  L('M','Que espetáculo magnífico é o céu! E pensar que tudo isso se apresenta aos nossos olhos todas as noites.'),
  L('F','Um espetáculo, sem dúvida. Mas não vos parece curioso que possamos contemplá-lo sem saber como funciona?'),
  L('M','Quereis dizer que o céu nos esconde alguma coisa?'),
  L('F','Muito mais do que imaginais, madame. E, para começar, convido-vos a uma visita ao teatro!')]},
 {id:'n1s2',t:'O teatro da natureza',stage:'theatre',steps:[
  C('O céu se dissolve e surge um palco de ópera do século XVII. Faetonte, personagem da mitologia grega, parece voar sobre a cena.'),
  L('M','Admirável! Mas como pode aquele homem voar?'),
  {t:'do',k:'bast',label:'Revelar os bastidores',done:'Os bastidores foram revelados: cordas, roldanas e contrapesos.'},
  L('F','Eis a questão, madame. O público vê o voo, mas não as máquinas que o tornam possível. Com a natureza acontece algo semelhante.'),
  {t:'ch',id:'n1c1',q:'O que o filósofo pretende demonstrar com a comparação entre a natureza e o teatro?',o:['A natureza funciona por magia, como os espetáculos teatrais.','Aquilo que vemos nem sempre revela as causas do que acontece.','Os filósofos deveriam estudar teatro em vez de astronomia.'],a:1,e:'O espectador vê o personagem voar, mas ignora as cordas que o sustentam. Assim também contemplamos os movimentos do céu sem conhecer suas causas. A tarefa do filósofo é justamente procurar aquilo que nossos olhos não conseguem revelar.'},
  L('M','Então os filósofos passam a vida tentando descobrir os bastidores do Universo? Confesso que não sei se devo admirá-los ou ter pena deles!')]},
 {id:'n1s3',t:'Copérnico tira a Terra do trono',stage:'models',steps:[
  L('F','Durante muito tempo, os homens colocaram a Terra imóvel no centro do Universo. Para explicar os movimentos dos astros, imaginaram numerosos círculos e céus que giravam uns dentro dos outros.'),
  L('M','Imagino que o Universo devesse ser uma máquina bastante complicada!'),
  L('F','A natureza, porém, é mais engenhosa do que costumamos imaginar. Ela realiza grandes obras com os meios mais simples possíveis.'),
  {t:'q',x:'É que a magnificência se encontra no projeto e a parcimônia na execução. Não há nada mais belo do que um grande projeto que se executa com poucos gastos.',src:'Fontenelle, Diálogos sobre a pluralidade dos mundos, p. 54 da edição utilizada.'},
  L('M','Então talvez sejamos nós que complicamos aquilo que a natureza realiza com tanta simplicidade?'),
  L('F','Precisamente! Muitas vezes atribuímos à natureza pequenos projetos que exigiriam esforços enormes. E isso, convenhamos, é totalmente ridículo!'),
  L('F','Até que apareceu Copérnico, um astrônomo decidido a reorganizar tudo. Retirou a Terra do centro e colocou o Sol em seu lugar!'),
  {t:'ch',id:'n1c2',set:'cop',q:'Qual dos dois modelos representa a organização proposta por Copérnico?',o:['Modelo A: a Terra permanece no centro.','Modelo B: o Sol ocupa o centro do sistema.'],a:1,e:'No sistema de Ptolomeu, a Terra permanecia imóvel, e os movimentos dos astros exigiam uma complicada organização de círculos. Copérnico propôs uma solução mais simples: os planetas, inclusive a Terra, percorrem seus caminhos ao redor do Sol. Em vez de fazer todo o céu girar para servir à Terra, atribuiu movimento à própria Terra. Assim, muitos dos movimentos que pareciam tão complicados puderam ser explicados de outra maneira.'},
  L('M','Pobre Terra! Copérnico lhe tirou o lugar de honra e ainda a obrigou a trabalhar!'),
  L('F','E talvez tenha feito muito bem! Os homens já se julgavam importantes demais, colocando-se no centro de tudo.'),
  L('M','Ora! Pensais que minha vaidade depende do lugar que ocupamos no Universo? Não me sinto menos importante por isso!')]},
 {id:'n1s4',t:'O barco que viaja sem que percebamos',stage:'boat',steps:[

const SCRIPT={"nights": [{"n": 2, "title": "A Lua poderá ser habitada?", "scenes": [{"t": "Uma nova surpresa no jardim", "steps": [{"t": "l", "w": "F", "x": "Dizei-me, madame, conseguistes dormir tranquilamente depois de descobrir que a Terra não para de se mover?"}, {"t": "l", "w": "M", "x": "Perfeitamente! Já me acostumei tanto a essa viagem que poderia dormir tão bem quanto o próprio Copérnico!"}, {"t": "l", "w": "F", "x": "Nesse caso, talvez estejais preparada para uma surpresa ainda maior. E se vos dissesse que a Lua é uma terra semelhante à nossa e que talvez seja habitada?"}, {"t": "l", "w": "M", "x": "Habitada? Ora, sempre ouvi falar disso como uma loucura!"}, {"t": "l", "w": "F", "x": "Talvez seja. Mas permiti-me apresentar alguns argumentos antes de decidirmos."}]}, {"t": "A cidade que ninguém consegue ver", "steps": [{"t": "l", "w": "F", "x": "Imaginai um parisiense que nunca saiu de sua cidade. Do alto de Notre-Dame, ele avista Saint-Denis, mas não consegue distinguir seus habitantes."}, {"t": "l", "w": "M", "x": "E por isso concluiria que não existe ninguém morando lá?"}, {"t": "l", "w": "F", "x": "Exatamente! Apesar de ver casas, torres e construções, ele insiste que a cidade é desabitada, simplesmente porque não enxerga pessoa alguma."}, {"t": "l", "w": "M", "x": "Que homem absurdo! Não ver os habitantes não significa que eles não existam!"}, {"t": "l", "w": "F", "x": "Pois bem, madame, talvez estejamos cometendo o mesmo erro ao observar a Lua."}, {"t": "ch", "id": "n2c1", "q": "O que Fontenelle pretende demonstrar com a comparação entre Paris, Saint-Denis e a Lua?", "o": ["Todas as cidades e todos os mundos são necessariamente habitados.", "Não enxergar habitantes não significa que eles não possam existir.", "Apenas os lugares próximos podem ser conhecidos."], "a": 1, "e": "A distância nos impede de perceber muitas coisas, madame. Não enxergamos os habitantes de Saint-Denis, mas isso não demonstra que a cidade esteja vazia. Da mesma forma, não vermos habitantes na Lua não basta para afirmar que eles não existem. É preciso considerar outras possibilidades antes de julgar."}, {"t": "l", "w": "M", "x": "Então aquele homem julga que Saint-Denis está desabitada apenas porque não consegue enxergar seus moradores? Que presunção!"}, {"t": "l", "w": "F", "x": "E não fazemos nós o mesmo, madame? Temos o costume de tomar os limites de nosso conhecimento como se fossem os limites do próprio mundo."}, {"t": "l", "w": "M", "x": "É verdade... Talvez aquilo que ignoramos seja muito maior do que aquilo que conhecemos."}, {"t": "l", "w": "F", "x": "Justamente. E é por isso que devemos desconfiar de nossas certezas quando sabemos tão pouco."}, {"t": "i", "x": "Não confundir desconhecimento com inexistência."}]}, {"t": "E se a Terra também brilhasse?", "steps": [{"t": "l", "w": "M", "x": "A Lua ilumina nossas noites. A Terra, ao contrário, parece-me apenas uma grande massa de terra e água."}, {"t": "l", "w": "F", "x": "Ah, madame! Julgais a Lua de longe e a Terra de perto. E isso muda completamente a maneira como as vedes!"}, {"t": "l", "w": "M", "x": "Quereis dizer que a Terra também poderia parecer luminosa?"}, {"t": "l", "w": "F", "x": "Certamente! A Lua não produz sua própria luz: ela reflete a luz que recebe do Sol. A Terra também pode refletir essa luz."}, {"t": "ch", "id": "n2c2", "q": "Por que, segundo o filósofo, a Terra também poderia parecer um astro luminoso?", "o": ["Porque a Terra produz sua própria luz durante a noite.", "Porque sua luz vem das estrelas mais distantes.", "Porque a Terra, assim como a Lua, reflete a luz do Sol."], "a": 2, "e": "É o Sol que ilumina tanto a Terra quanto a Lua. Vemos a Lua brilhante porque estamos distantes dela e recebemos a luz que ela reflete. Se pudéssemos observá-la de outro lugar, a Terra também nos pareceria luminosa. Muitas vezes julgamos as coisas de maneira diferente apenas porque as observamos de posições diferentes."}, {"t": "l", "w": "M", "x": "Que injustiça cometemos com a Terra! Admiramos tanto a Lua porque a vemos de longe, sem perceber que nossa própria morada também poderia ser admirada."}, {"t": "l", "w": "F", "x": "Assim fazemos com quase tudo, madame. Queremos julgar a nós mesmos, mas estamos perto demais. Queremos julgar os outros, mas estamos longe demais. Talvez fosse preciso não habitar o mundo, mas observá-lo como simples espectadores."}, {"t": "l", "w": "M", "x": "Então a distância que nos permite admirar a Lua também pode nos impedir de compreender aquilo que está próximo?"}, {"t": "l", "w": "F", "x": "Precisamente. Nem sempre o lugar de onde olhamos é o melhor lugar para compreender."}, {"t": "i", "x": "Nossa posição e nossa perspectiva influenciam nossos julgamentos."}]}, {"t": "A extraordinária viagem de Astolfo", "steps": [{"t": "l", "w": "M", "x": "Mas se a Lua é um mundo como o nosso, quem poderia nos contar o que existe por lá?"}, {"t": "l", "w": "F", "x": "Talvez devêssemos perguntar a Astolfo! Conta Ariosto que esse cavaleiro viajou até a Lua e encontrou um vale onde se guardava tudo aquilo que os homens haviam perdido na Terra."}, {"t": "l", "w": "M", "x": "Tudo? Até aquilo que perdemos quando nos apaixonamos?"}, {"t": "l", "w": "F", "x": "Principalmente a razão, madame! Estava guardada em pequenos frascos. Receio que alguns deles fossem bastante grandes!"}, {"t": "l", "w": "M", "x": "Nesse caso, talvez devêssemos procurar os nossos antes de continuar esta conversa!"}]}, {"t": "Quem poderia viver na Lua?", "steps": [{"t": "l", "w": "M", "x": "Pois bem, começais a convencer-me de que a Lua se parece mais com a Terra do que eu imaginava. Mas que espécie de pessoas poderia habitá-la?"}, {"t": "l", "w": "F", "x": "Pessoas? Não disse que seriam homens como nós!"}, {"t": "l", "w": "M", "x": "Então esses possíveis habitantes da Lua, que poderíamos chamar de selenitas, talvez sejam completamente diferentes de nós?"}, {"t": "l", "w": "F", "x": "Tão diferentes, madame, que talvez não sejamos sequer capazes de imaginá-los!"}, {"t": "ch", "id": "n2c3", "q": "Qual é a posição do filósofo sobre os possíveis habitantes da Lua?", "o": ["A Lua certamente é habitada por pessoas iguais às da Terra.", "A Lua pode ser habitada, mas não sabemos se existem habitantes nem como seriam.", "A Lua não pode ter habitantes porque está muito distante."], "a": 1, "e": "Não devemos confundir uma possibilidade com uma certeza, madame. A Lua apresenta semelhanças com a Terra, e isso nos permite imaginar que talvez existam habitantes por lá. Mas não sabemos se realmente existem, muito menos como seriam. Seria um erro imaginar que todas as criaturas do Universo precisam ser semelhantes aos homens."}, {"t": "l", "w": "M", "x": "Que situação desesperadora! Saber que talvez existam criaturas tão próximas de nós e não fazer ideia de sua aparência!"}, {"t": "l", "w": "F", "x": "E, no entanto, madame, ainda conhecemos tão pouco sobre nós mesmos... Talvez os habitantes da Lua também não conseguissem imaginar que criaturas tão estranhas quanto os homens poderiam existir!"}, {"t": "l", "w": "M", "x": "Então não somos necessariamente o modelo de todas as coisas?"}, {"t": "l", "w": "F", "x": "Certamente não. O Universo talvez seja muito mais diverso do que nossa imaginação permite conceber."}, {"t": "i", "x": "Distinguir hipótese de certeza; rejeitar a ideia de que tudo precisa se parecer conosco."}]}, {"t": "Encerramento", "steps": [{"t": "l", "w": "M", "x": "Ontem descobri que a Terra não está imóvel. Hoje, descubro que talvez nem sejamos os únicos habitantes do Universo. Confesso que começo a desconfiar de tudo aquilo que julgava conhecer!"}, {"t": "l", "w": "F", "x": "E fazeis muito bem, madame. Afinal, quanto mais observamos o Universo, mais perguntas encontramos."}, {"t": "l", "w": "M", "x": "Então amanhã quero saber ainda mais sobre essa Lua misteriosa!"}, {"t": "l", "w": "F", "x": "Com prazer. Mas talvez algumas novas descobertas vos façam reconsiderar o que hoje parece tão provável..."}]}]}, {"n": 3, "title": "O Universo é muito mais diverso do que imaginamos", "scenes": [{"t": "A marquesa não quer perder seus habitantes da Lua", "steps": [{"t": "l", "w": "F", "x": "Tenho notícias, madame. Receio que nossos habitantes da Lua estejam em perigo!"}, {"t": "l", "w": "M", "x": "Como assim? Ontem quase me convencestes de que existiam, e hoje quereis fazê-los desaparecer? Não permitirei semelhante crueldade!"}, {"t": "l", "w": "F", "x": "É que observei uma dificuldade. Na Terra, vemos nuvens mudando continuamente de lugar. Na Lua, entretanto, suas manchas parecem permanecer sempre nas mesmas posições."}, {"t": "l", "w": "M", "x": "E isso é motivo suficiente para expulsar todos os meus selenitas?"}, {"t": "l", "w": "F", "x": "Talvez não. Mas é motivo para reconsiderarmos aquilo em que acreditamos."}]}, {"t": "Podemos mudar de opinião?", "steps": [{"t": "l", "w": "M", "x": "Então as diferenças entre a Lua e a Terra podem ser maiores do que imaginávamos?"}, {"t": "l", "w": "F", "x": "Exatamente. E, quando surgem novas razões para duvidar, devemos estar preparados para reconsiderar nossas opiniões."}, {"t": "ch", "id": "n3c1", "q": "O que a atitude do filósofo nos ensina sobre o conhecimento?", "o": ["Uma opinião deve ser mantida mesmo quando surgem argumentos contrários.", "Devemos abandonar qualquer ideia assim que alguém apresenta uma dúvida.", "Devemos considerar novas evidências e permanecer abertos a rever nossas ideias."], "a": 2, "e": "Uma hipótese pode parecer convincente e, ainda assim, encontrar dificuldades. A ausência de nuvens visíveis na Lua nos obriga a reconsiderar nossas suposições, mas não resolve definitivamente a questão dos habitantes. A verdadeira sabedoria está em examinar as razões e conservar a liberdade de mudar de opinião."}, {"t": "l", "w": "M", "x": "Confesso que isso me desagrada! Ontem precisei vencer minhas dúvidas para acreditar nesses habitantes, e hoje me pedis que desconfie deles? Devo mudar de opinião a cada nova descoberta?"}, {"t": "l", "w": "F", "x": "Não necessariamente, madame. Mas também não devemos nos apegar tanto a uma ideia que já não sejamos capazes de reconhecer quando surgem razões para questioná-la."}, {"t": "l", "w": "M", "x": "Então de que serve acreditar em alguma coisa, se amanhã podemos descobrir que estávamos enganados?"}, {"t": "l", "w": "F", "x": "Serve para compreender o que sabemos até agora. Mas o conhecimento não deve ser uma prisão. É preciso conservar uma parte de nosso espírito livre, pronta para admitir uma explicação diferente, caso encontremos razões melhores."}, {"t": "l", "w": "M", "x": "Parece-me que os homens preferem defender suas certezas a descobrir seus próprios enganos."}, {"t": "l", "w": "F", "x": "E eis um grande perigo, madame! Quando nos preocupamos mais em provar que temos razão do que em descobrir a verdade, deixamos de aprender."}, {"t": "l", "w": "M", "x": "Então mudar de opinião não significa necessariamente que pensamos mal antes?"}, {"t": "l", "w": "F", "x": "Não, madame. Às vezes, significa apenas que agora sabemos um pouco mais."}, {"t": "i", "x": "Revisar uma opinião diante de novos argumentos não é fraqueza nem aceitar qualquer afirmação."}]}, {"t": "As lentes invisíveis da imaginação", "steps": [{"t": "l", "w": "F", "x": "Tudo aquilo que vemos passa por uma espécie de lente natural: o ar que nos cerca. Se essa lente fosse diferente, talvez o céu também nos parecesse diferente."}, {"t": "l", "w": "M", "x": "Um céu vermelho, com estrelas verdes? Confesso que não me parece uma combinação muito elegante!"}, {"t": "l", "w": "F", "x": "Ah, madame! Quereis escolher as cores do Universo como se estivésseis escolhendo um vestido!"}, {"t": "l", "w": "M", "x": "E por que não? A natureza deveria ter algum cuidado com o bom gosto!"}, {"t": "l", "w": "F", "x": "Não duvido de sua habilidade. Mas existe outra espécie de lente que modifica ainda mais aquilo que vemos."}, {"t": "l", "w": "M", "x": "E qual seria?"}, {"t": "l", "w": "F", "x": "Nossa própria imaginação."}, {"t": "ch", "id": "n3c2", "q": "O que o filósofo pretende demonstrar com as diferentes lentes da imaginação?", "o": ["A realidade muda completamente de acordo com os desejos de cada pessoa.", "Diferentes pessoas podem interpretar uma mesma realidade de maneiras distintas.", "Apenas os filósofos conseguem enxergar o mundo corretamente."], "a": 1, "e": "A Terra permanece a mesma, mas Alexandre vê nela um império a conquistar; Céladon, o lugar de sua amada; e o filósofo, um mundo que se move entre os astros. Não são apenas nossos olhos que influenciam aquilo que vemos. Nossos desejos, experiências e pensamentos também modificam nossos julgamentos."}, {"t": "l", "w": "M", "x": "Então carregamos nossas próprias lentes sem sequer perceber?"}, {"t": "l", "w": "F", "x": "E frequentemente acreditamos que todos deveriam enxergar exatamente como nós."}, {"t": "l", "w": "M", "x": "Talvez seja por isso que duas pessoas podem contemplar a mesma coisa e discutir como se estivessem diante de mundos completamente diferentes!"}, {"t": "l", "w": "F", "x": "Precisamente, madame. Antes de julgar aquilo que outro vê, talvez devêssemos perguntar através de quais lentes ele observa."}, {"t": "i", "x": "Nossas experiências e expectativas moldam a interpretação da realidade."}]}, {"t": "Um Universo repleto de mundos", "steps": [{"t": "l", "w": "M", "x": "Mas, afinal, continuaremos discutindo apenas os habitantes da Lua?"}, {"t": "l", "w": "F", "x": "De modo algum! Se a Terra é um planeta e a Lua pode ser um mundo, por que outros planetas não poderiam também abrigar habitantes?"}, {"t": "l", "w": "M", "x": "Com esse vosso “por que não?”, acabareis povoando o Universo inteiro!"}, {"t": "l", "w": "F", "x": "E talvez nem seja necessário procurar tão longe para descobrir quantas criaturas a natureza é capaz de produzir."}, {"t": "l", "w": "F", "x": "Há criaturas tão pequenas que nossos olhos não as enxergam. Uma simples folha pode ser, para elas, um mundo tão vasto quanto a Terra é para nós."}]}, {"t": "O povo de um mundo desconhecido", "steps": [{"t": "l", "w": "F", "x": "Conheço, madame, um povo de outro mundo cujos costumes certamente vos surpreenderiam."}, {"t": "l", "w": "M", "x": "Finalmente! Já estava impaciente para conhecer alguma dessas criaturas extraordinárias."}, {"t": "l", "w": "F", "x": "São habitantes extremamente ativos, habilidosos e trabalhadores. Vivem em perfeita organização, cada qual dedicado ao bem de sua comunidade."}, {"t": "l", "w": "M", "x": "Um povo tão organizado? Começo a acreditar que sejam mais civilizados do que nós!"}, {"t": "l", "w": "F", "x": "Talvez mudeis de opinião quando souberdes que vivem de saquear as riquezas alheias!"}, {"t": "l", "w": "M", "x": "Que contradição! Tão trabalhadores e, ao mesmo tempo, ladrões?"}, {"t": "l", "w": "F", "x": "E ainda há coisas mais curiosas. A maior parte dessa população não possui descendentes. Entretanto, sua nação não corre o menor risco de desaparecer."}, {"t": "l", "w": "M", "x": "Como seria possível? Pretendeis que eu acredite em uma sociedade que se perpetua sem que seus habitantes tenham filhos?"}, {"t": "l", "w": "F", "x": "É que possuem uma rainha de fecundidade extraordinária! Sua principal ocupação é produzir milhares de descendentes."}, {"t": "l", "w": "F", "x": "Seu palácio possui incontáveis aposentos, cada um preparado para receber um de seus filhos. E enquanto a rainha se dedica a essa tarefa, todo o povo trabalha incansavelmente."}, {"t": "l", "w": "M", "x": "E quem governa esse reino enquanto Sua Majestade se ocupa de tão numerosa família?"}, {"t": "l", "w": "F", "x": "A rainha pouco se ocupa dos negócios do Estado. E há ainda alguns habitantes que não trabalham, mas cuja única função é assegurar a continuidade da espécie."}, {"t": "l", "w": "M", "x": "Um povo de ladrões trabalhadores, governado por uma rainha que passa a vida tendo filhos e cercada por criaturas ociosas? Confesso que vossa história parece cada vez menos digna de crédito!"}, {"t": "l", "w": "F", "x": "Entretanto, madame, tudo o que vos conto acontece realmente."}, {"t": "ch", "id": "n3c3", "q": "Que criaturas o filósofo está descrevendo?", "o": ["Habitantes desconhecidos de Saturno.", "Uma civilização imaginária da Lua.", "As abelhas, que vivem aqui mesmo na Terra."], "a": 2, "e": "Pois bem, madame, meus extraordinários habitantes são simplesmente as abelhas! Seus trabalhadores recolhem recursos da natureza, sua rainha produz numerosos descendentes e toda a colmeia possui uma organização admirável. Aquilo que vos parecia uma sociedade impossível existe aqui mesmo, diante de nossos olhos!"}, {"t": "l", "w": "M", "x": "Fizestes-me imaginar um povo de outro planeta, quando descrevíeis criaturas que vivem em nosso próprio jardim! Confesso que me deixei enganar completamente."}, {"t": "l", "w": "F", "x": "E por que vos pareceu tão difícil acreditar nessa sociedade, madame? Apenas porque seus costumes são diferentes dos nossos?"}, {"t": "l", "w": "M", "x": "Talvez porque imaginei que uma sociedade precisasse se organizar como a nossa para ser possível."}, {"t": "l", "w": "F", "x": "Eis justamente o problema. Julgamos aquilo que desconhecemos a partir daquilo que nos é familiar. Mas a natureza não está obrigada a repetir nossos costumes, nossas formas ou nossa maneira de viver."}, {"t": "l", "w": "M", "x": "Então aquilo que nos parece absurdo pode ser perfeitamente natural em outro mundo?"}, {"t": "l", "w": "F", "x": "Exatamente. Se a própria Terra abriga criaturas tão diferentes de nós, imaginai a diversidade que outros mundos poderiam apresentar!"}, {"t": "l", "w": "M", "x": "Talvez a natureza não seja limitada em suas possibilidades. Talvez sejamos nós que sejamos limitados em nossa imaginação."}, {"t": "i", "x": "Uma realidade estranha não é necessariamente impossível; nossos padrões não medem toda a diversidade da natureza."}]}, {"t": "Encerramento", "steps": [{"t": "l", "w": "M", "x": "Comecei esta noite disposta a defender os habitantes da Lua e termino descobrindo que conheço muito pouco até mesmo sobre os habitantes da Terra!"}, {"t": "l", "w": "F", "x": "E ainda há tantos outros mundos a considerar!"}, {"t": "l", "w": "M", "x": "Pois amanhã quero visitá-los todos! Mas, por favor, não me apresenteis outra colmeia como se fosse um reino distante!"}, {"t": "l", "w": "F", "x": "Prometo, madame, que nossa próxima viagem nos levará verdadeiramente a outros planetas. Ao menos em imaginação!"}]}]}, {"n": 4, "title": "Uma viagem pelos outros mundos", "scenes": [{"t": "Uma viagem que começou em sonhos", "steps": [{"t": "l", "w": "F", "x": "Então, madame, vossos sonhos finalmente vos revelaram a aparência dos habitantes dos outros planetas?"}, {"t": "l", "w": "M", "x": "Infelizmente, não! Sonhei com criaturas que se pareciam demais com tudo aquilo que já conheço."}, {"t": "l", "w": "F", "x": "Era o que eu receava. Nossa imaginação tem o péssimo costume de repetir aquilo que nossos olhos já viram."}, {"t": "l", "w": "M", "x": "Depois de vossas abelhas extraordinárias, eu esperava sonhar com seres muito mais interessantes!"}, {"t": "l", "w": "F", "x": "Nesse caso, deixemos de lado suas aparências e procuremos descobrir como poderiam ser os mundos onde vivem."}, {"t": "l", "w": "M", "x": "Muito bem! Mas desta vez quero visitar planetas de verdade. Não me apresenteis outra colmeia!"}, {"t": "l", "w": "F", "x": "Prometo que não sairemos do céu, madame!"}]}, {"t": "Vênus e Mercúrio: mundos de fogo", "steps": [{"t": "l", "w": "F", "x": "Comecemos por Vênus. Está mais próxima do Sol do que a Terra e recebe mais luz e calor."}, {"t": "l", "w": "M", "x": "Vênus! O próprio nome já me faz imaginar um mundo de festas, música, poesia e apaixonados!"}, {"t": "l", "w": "F", "x": "E que diríeis de Mercúrio, ainda mais próximo do Sol? Imaginai quanto calor seus habitantes teriam de suportar!"}, {"t": "l", "w": "M", "x": "Pobres criaturas! Não terão um instante de descanso?"}, {"t": "l", "w": "F", "x": "Talvez estejam tão acostumadas ao calor que considerariam nosso clima insuportavelmente frio."}, {"t": "l", "w": "M", "x": "Então aquilo que para nós é agradável poderia ser um tormento para eles?"}, {"t": "l", "w": "F", "x": "Exatamente. E aquilo que nos parece impossível talvez lhes fosse perfeitamente natural."}, {"t": "ch", "id": "n4c1", "q": "Por que o filósofo imagina que os habitantes de Mercúrio poderiam suportar condições tão diferentes das nossas?", "o": ["Porque todos os seres do Universo possuem as mesmas necessidades.", "Porque os seres poderiam estar habituados às condições particulares do mundo em que vivem.", "Porque Mercúrio receberia menos calor do Sol do que a Terra."], "a": 1, "e": "Julgamos o calor e o frio segundo aquilo a que estamos acostumados. Mas, se existissem habitantes em Mercúrio, seria preciso imaginá-los adaptados às condições daquele mundo. O que nos parece excessivo talvez lhes parecesse comum. Não devemos tomar nossa própria maneira de viver como medida de todas as criaturas do Universo."}, {"t": "l", "w": "M", "x": "Curioso! Chamamos insuportável aquilo que não conseguiríamos suportar, sem considerar que outras criaturas poderiam viver de maneira completamente diferente."}, {"t": "l", "w": "F", "x": "E fazemos o mesmo com os homens, madame. Aquilo que nos é estranho facilmente nos parece absurdo, apenas porque estamos habituados a outros costumes."}, {"t": "l", "w": "M", "x": "Então talvez devêssemos ser menos apressados em julgar a vida dos outros a partir da nossa."}, {"t": "l", "w": "F", "x": "Sem dúvida. Conhecer outros mundos, mesmo que apenas em imaginação, pode ensinar-nos a reconhecer os limites do nosso próprio."}, {"t": "i", "x": "Nossa experiência e nossos hábitos não são uma medida universal."}]}, {"t": "Júpiter: um mundo com quatro luas", "steps": [{"t": "l", "w": "M", "x": "Que planeta majestoso! Mas por que possui tantas luas? Acaso uma só não lhe bastaria?"}, {"t": "l", "w": "F", "x": "Júpiter tem quatro luas conhecidas, madame, enquanto nossa Terra possui apenas uma. E cada uma delas gira ao seu redor."}, {"t": "l", "w": "M", "x": "Mas por que alguns pequenos planetas girariam em torno de outros? Não seria mais simples que todos girassem apenas ao redor do Sol?"}, {"t": "l", "w": "F", "x": "Para compreender isso, precisamos falar dos turbilhões de Descartes."}, {"t": "l", "w": "M", "x": "Turbilhões? Que palavra terrível! Acabareis por me deixar tonta com tanta filosofia!"}, {"t": "l", "w": "F", "x": "Imaginai uma grande corrente de matéria celeste que se movimenta ao redor do Sol, levando consigo os planetas. Cada planeta, por sua vez, poderia possuir uma corrente menor, capaz de transportar suas luas."}, {"t": "l", "w": "M", "x": "Então existiriam movimentos dentro de outros movimentos? Como pequenos mundos viajando dentro de um mundo maior?"}, {"t": "l", "w": "F", "x": "Precisamente! Assim Descartes procurava explicar os movimentos dos astros."}, {"t": "ch", "id": "n4c2", "q": "O que a existência das luas de Júpiter revela sobre a organização dos mundos?", "o": ["Que todos os astros precisam girar diretamente ao redor da Terra.", "Que um planeta pode acompanhar o movimento ao redor do Sol e, ao mesmo tempo, possuir luas que giram ao seu redor.", "Que Júpiter permanece imóvel enquanto todas as suas luas giram ao redor do Sol."], "a": 1, "e": "Júpiter acompanha os demais planetas em seu caminho ao redor do Sol, enquanto suas quatro luas giram ao redor dele. Não é necessário que todos os movimentos tenham um único centro. Assim, encontramos no Universo sistemas menores dentro de sistemas maiores. Descartes procurou explicar essa organização por meio de seus turbilhões de matéria celeste."}, {"t": "l", "w": "M", "x": "Então a Terra nem sequer possui o privilégio de ter uma Lua? Outros planetas também podem ter suas pequenas companheiras!"}, {"t": "l", "w": "F", "x": "E talvez suas luas sejam, para seus habitantes, mundos tão importantes quanto a nossa Lua é para nós."}, {"t": "l", "w": "M", "x": "Curioso! Pensamos tantas vezes que aquilo que nos pertence é especial, quando talvez existam coisas semelhantes por toda parte."}, {"t": "l", "w": "F", "x": "É uma boa lição, madame. A natureza não precisa reservar suas maravilhas exclusivamente para nós."}, {"t": "i", "x": "Questionar o privilégio que atribuímos à experiência da Terra."}]}, {"t": "Saturno: o mundo do frio e da lentidão", "steps": [{"t": "l", "w": "M", "x": "Que mundo extraordinário! Mas parece tão frio e distante... Não me surpreenderia se seus habitantes passassem a vida tremendo!"}, {"t": "l", "w": "F", "x": "É um mundo muito afastado do Sol. Se imaginarmos que possui habitantes, devemos supor que estariam habituados a condições bem diferentes das nossas."}, {"t": "l", "w": "M", "x": "Depois dos habitantes tão agitados de Mercúrio, imagino que os de Saturno sejam muito tranquilos."}, {"t": "l", "w": "F", "x": "Tranquilos? Talvez sejam tão lentos que precisem de um dia inteiro para responder à mais simples pergunta!"}, {"t": "l", "w": "M", "x": "Nesse caso, jamais conseguiríamos terminar nossas conversas!"}, {"t": "l", "w": "F", "x": "E vós, madame, jamais suportaríeis tamanha demora!"}, {"t": "l", "w": "M", "x": "Mas tive uma ideia! Se os habitantes de Mercúrio são tão rápidos e os de Saturno tão lentos, talvez nós, que vivemos entre esses extremos, tenhamos um pouco de todos eles!"}, {"t": "l", "w": "F", "x": "Uma observação bastante engenhosa. Talvez os homens sejam uma mistura de todas as espécies de temperamentos imagináveis."}, {"t": "l", "w": "M", "x": "Então a Terra seria uma espécie de resumo de todos os outros mundos?"}, {"t": "l", "w": "F", "x": "Ao menos em nossa imaginação, madame!"}, {"t": "ch", "id": "n4c3", "q": "O que a marquesa sugere ao comparar os habitantes de Mercúrio, Saturno e Terra?", "o": ["Que todos os seres humanos possuem exatamente o mesmo temperamento.", "Que a Terra reúne temperamentos diversos, que ela imagina semelhantes aos extremos dos outros mundos.", "Que os habitantes dos planetas possuem costumes comprovadamente iguais aos nossos."], "a": 1, "e": "A marquesa imagina que os habitantes de Mercúrio seriam muito agitados, enquanto os de Saturno seriam extremamente lentos. Entre os homens, entretanto, encontramos toda espécie de temperamento. Sua comparação é uma brincadeira engenhosa, que nos faz perceber como a diversidade também está presente entre nós."}, {"t": "l", "w": "M", "x": "Depois de conhecer mundos tão quentes e tão frios, começo a perceber que nossa Terra oferece muitas comodidades. Deveríamos ser gratos por isso!"}, {"t": "l", "w": "F", "x": "Ora, madame! Se quereis agradecer à natureza, por que não começais por ser jovem, bela e francesa? Certamente encontrareis nisso motivos de gratidão!"}, {"t": "l", "w": "M", "x": "E por que deveria escolher? Quero agradecer também pelas coisas mais simples! Afinal, a felicidade que nos cabe já é tão pequena. Não devemos desperdiçar nenhuma ocasião de aproveitá-la."}, {"t": "l", "w": "F", "x": "Então até mesmo a temperatura agradável de uma noite merece vossa gratidão?"}, {"t": "l", "w": "M", "x": "Naturalmente! Se esperarmos apenas pelos grandes prazeres, passaremos boa parte da vida esperando. Talvez a verdadeira sabedoria esteja em saber apreciar também os pequenos."}, {"t": "l", "w": "F", "x": "Nesse caso, madame, espero que nossas conversas filosóficas continuem entre esses prazeres."}, {"t": "l", "w": "M", "x": "Desde que continueis a me oferecer novas descobertas, não vejo por que deixariam de ser!"}, {"t": "i", "x": "Não desperdiçar pequenos prazeres; felicidade e gratidão nas experiências comuns."}]}, {"t": "Encerramento", "steps": [{"t": "l", "w": "M", "x": "Esta noite visitamos mundos de calor, de frio, de movimentos extraordinários... E, no entanto, terminamos falando da felicidade que encontramos aqui mesmo."}, {"t": "l", "w": "F", "x": "Talvez seja essa uma das maiores vantagens da filosofia, madame. Ela nos faz viajar para muito longe, apenas para enxergarmos de outra maneira aquilo que sempre esteve diante de nós."}, {"t": "l", "w": "M", "x": "Confesso que, depois dessa viagem, nunca mais olharei para o céu da mesma maneira."}, {"t": "l", "w": "F", "x": "E ainda não vimos tudo. Amanhã, deixaremos os planetas para descobrir o que realmente são essas incontáveis estrelas."}, {"t": "l", "w": "M", "x": "Mais mundos? Estou começando a desconfiar de que vosso Universo não tem fim!"}]}]}, {"n": 5, "title": "Um Universo sem fim?", "scenes": [{"t": "Uma estrela pode esconder um mundo inteiro?", "steps": [{"t": "l", "w": "M", "x": "Já percorremos tantos planetas, mas ainda não me dissestes o que faremos com todas essas estrelas. Também pretendeis povoá-las?"}, {"t": "l", "w": "F", "x": "Talvez não seja necessário que eu vos diga, madame. Depois de nossas conversas, creio que já sois capaz de descobrir sozinha."}, {"t": "l", "w": "M", "x": "Vejamos... Nosso Sol ilumina a Terra e os demais planetas. Mas as estrelas estão tão distantes e, ainda assim, brilham com tanta intensidade..."}, {"t": "l", "w": "F", "x": "Continuai, madame. Estais no caminho certo."}, {"t": "l", "w": "M", "x": "Então não recebem a luz do nosso Sol! Devem possuir sua própria luz. Seriam, portanto, outros sóis!"}, {"t": "l", "w": "F", "x": "Precisamente!"}, {"t": "l", "w": "M", "x": "Mas esperai! Se cada uma dessas estrelas é um Sol, por que não poderia também iluminar seus próprios planetas?"}, {"t": "l", "w": "F", "x": "Madame, vejo que já não precisais de mim para multiplicar os mundos!"}]}, {"t": "Cada estrela, um Sol", "steps": [{"t": "l", "w": "F", "x": "As estrelas estão a distâncias tão extraordinárias que não poderiam receber do nosso Sol luz suficiente para brilhar como as vemos. São, portanto, luminosas por si mesmas."}, {"t": "l", "w": "M", "x": "Então nosso Sol, visto de outro mundo, pareceria apenas mais uma estrela?"}, {"t": "l", "w": "F", "x": "Exatamente! Aquilo que para nós é o grande Sol do dia seria, para habitantes muito distantes, apenas um pequeno ponto brilhante no céu."}, {"t": "ch", "id": "n5c1", "q": "Por que Fontenelle considera que as estrelas poderiam ser outros sóis?", "o": ["Porque todas recebem sua luz do nosso Sol.", "Porque possuem luz própria e poderiam iluminar planetas, assim como o nosso Sol.", "Porque são planetas que refletem a luz da Terra."], "a": 1, "e": "As estrelas estão muito distantes para que seu brilho seja apenas a luz refletida do nosso Sol. São luminosas por si mesmas e, por isso, podemos compará-las a ele. E, se o nosso Sol ilumina planetas, por que não imaginar que outras estrelas também possam iluminar seus próprios mundos? Eis como o Universo se torna muito maior do que supúnhamos."}, {"t": "l", "w": "M", "x": "Então nosso Sol, que sempre me pareceu tão extraordinário, seria apenas um entre incontáveis outros?"}, {"t": "l", "w": "F", "x": "Para nós ele é único, madame, porque é o Sol que nos ilumina. Mas, para habitantes de outros mundos, talvez não seja mais importante do que qualquer outra estrela."}, {"t": "l", "w": "M", "x": "Que maneira curiosa de diminuir nossa importância! Primeiro retirastes a Terra do centro do Universo; agora retirais até do nosso Sol o privilégio de ser único!"}, {"t": "l", "w": "F", "x": "A natureza parece pouco preocupada com os privilégios que os homens gostam de atribuir a si mesmos."}, {"t": "l", "w": "M", "x": "Então aquilo que consideramos extraordinário talvez seja apenas aquilo que conhecemos mais de perto."}, {"t": "l", "w": "F", "x": "E reconhecer isso não torna nosso mundo menos belo. Apenas nos permite admirar muitos outros."}, {"t": "i", "x": "A importância local das coisas não determina seu privilégio universal."}]}, {"t": "A imensidão que provoca vertigem", "steps": [{"t": "l", "w": "M", "x": "Mas então o Universo é tão grande que já não sei onde me encontro! Nosso Sol e todos os seus planetas seriam apenas uma pequena parte dessa imensidão?"}, {"t": "l", "w": "F", "x": "Exatamente, madame."}, {"t": "l", "w": "M", "x": "Confesso que essa ideia me perturba. Quanto mais multiplicais os mundos, menor me sinto!"}, {"t": "l", "w": "F", "x": "Curioso! A mim acontece justamente o contrário. Quando imaginava o céu como uma pequena abóbada sobre nossas cabeças, sentia-me quase aprisionado. Agora, com tantos mundos e tamanha imensidão, parece-me que posso respirar com mais liberdade."}, {"t": "l", "w": "M", "x": "Então o que me assusta é justamente aquilo que vos encanta?"}, {"t": "l", "w": "F", "x": "A mesma descoberta pode provocar sentimentos muito diferentes, madame."}, {"t": "ch", "id": "n5c2", "q": "Por que a marquesa e o filósofo reagem de maneira tão diferente à imensidão do Universo?", "o": ["Porque apenas o filósofo consegue compreender os movimentos dos astros.", "Porque a marquesa considera que o Universo ficou menor.", "Porque a mesma descoberta pode despertar sentimentos diferentes: medo diante da imensidão ou admiração pelas novas possibilidades."], "a": 2, "e": "Ao descobrir a imensidão do Universo, a marquesa sente-se pequena e perdida. Eu, ao contrário, sinto uma liberdade que não encontrava no antigo céu fechado. A grandeza da natureza não muda conforme nossos sentimentos, mas a maneira como a interpretamos pode transformar completamente nossa experiência."}, {"t": "l", "w": "M", "x": "Mas como não sentir algum temor diante de um Universo tão imenso? Nossa existência parece quase nada diante de tantos mundos!"}, {"t": "l", "w": "F", "x": "Talvez porque ainda procureis medir vossa importância pelo espaço que ocupais."}, {"t": "l", "w": "M", "x": "E não é natural fazê-lo?"}, {"t": "l", "w": "F", "x": "Nem sempre, madame. A grandeza do Universo não nos impede de conhecê-lo, questioná-lo e admirá-lo. Talvez nossa condição seja pequena diante dos astros, mas nossa curiosidade é capaz de nos levar muito além de nosso jardim."}, {"t": "l", "w": "M", "x": "Então descobrir que não somos o centro de tudo não precisa ser motivo de tristeza?"}, {"t": "l", "w": "F", "x": "Ao contrário. Pode ser uma oportunidade de abandonar nossa vaidade e descobrir maravilhas que jamais imaginaríamos existir."}, {"t": "i", "x": "Ser pequeno no espaço não equivale a ser insignificante."}]}, {"t": "A Via Láctea, uma multidão de estrelas", "steps": [{"t": "l", "w": "F", "x": "E ainda não vos mostrei tudo! Vedes aquela faixa luminosa que atravessa o céu?"}, {"t": "l", "w": "M", "x": "A Via Láctea?"}, {"t": "l", "w": "F", "x": "Sim. Aquela claridade que parece contínua é formada por uma quantidade imensa de estrelas, tão próximas umas das outras aos nossos olhos que seus brilhos parecem se confundir."}, {"t": "l", "w": "M", "x": "Mais estrelas? Tende piedade de mim! Já mal consigo contar os mundos que me apresentastes!"}, {"t": "l", "w": "F", "x": "E eu ainda vos falaria de mundos tão próximos entre si que seus habitantes poderiam, em nossa imaginação, trocar mensagens com os vizinhos!"}]}, {"t": "Até as estrelas podem desaparecer", "steps": [{"t": "l", "w": "F", "x": "Mas há algo que talvez vos surpreenda ainda mais, madame. Nem mesmo as estrelas permanecem necessariamente como sempre foram."}, {"t": "l", "w": "M", "x": "Como assim? Quereis dizer que até os sóis podem desaparecer?"}, {"t": "l", "w": "F", "x": "Os astrônomos observaram estrelas que antes eram vistas e depois deixaram de aparecer. Também encontraram outras que não haviam sido observadas anteriormente."}, {"t": "l", "w": "M", "x": "Que ideia terrível! Imaginai os habitantes de um mundo cujo Sol deixasse de brilhar! Ficariam mergulhados em uma noite eterna!"}, {"t": "l", "w": "F", "x": "Seria realmente uma desgraça, se tal coisa acontecesse. Mas não sabemos se todas as estrelas que desaparecem de nossa vista realmente se extinguem."}, {"t": "l", "w": "M", "x": "Então até para a morte das estrelas tendes várias explicações?"}, {"t": "l", "w": "F", "x": "É preciso considerar as possibilidades, madame. O importante é reconhecer que o céu talvez não seja tão imutável quanto os antigos imaginavam."}]}, {"t": "As rosas e o jardineiro", "steps": [{"t": "l", "w": "F", "x": "Imaginai, madame, que as rosas de vosso jardim pudessem escrever a história de suas vidas."}, {"t": "l", "w": "M", "x": "Que ideia encantadora! E o que escreveriam?"}, {"t": "l", "w": "F", "x": "Uma rosa vive tão pouco que poderia nascer e morrer sem perceber qualquer mudança no jardineiro. As gerações seguintes talvez concluíssem que ele é eterno, apenas porque nenhuma delas viveu tempo suficiente para vê-lo envelhecer."}, {"t": "l", "w": "M", "x": "Mas o jardineiro também envelhece e um dia morrerá!"}, {"t": "l", "w": "F", "x": "Precisamente! E talvez o mesmo aconteça com os astros. Eles podem durar tanto que, durante toda a história dos homens, pareçam permanecer iguais. Mas isso não significa que sejam eternos."}, {"t": "ch", "id": "n5c3", "q": "O que o filósofo pretende demonstrar com a história das rosas e do jardineiro?", "o": ["Aquilo que permanece inalterado durante nossa vida não é necessariamente eterno.", "Os seres humanos vivem tanto quanto as estrelas.", "A natureza não passa por transformações verdadeiras."], "a": 0, "e": "As rosas poderiam acreditar que o jardineiro é eterno porque sua vida é curta demais para perceber as mudanças dele. Nós também podemos cometer esse engano ao observar o céu. Uma estrela pode parecer imutável durante milhares de anos, sem que isso prove que permanecerá assim para sempre. Nossa experiência do tempo não é a medida de toda a natureza."}, {"t": "l", "w": "M", "x": "Então, assim como as rosas não compreendem a duração da vida do jardineiro, talvez nós não consigamos compreender a duração da vida das estrelas."}, {"t": "l", "w": "F", "x": "Exatamente, madame. Temos o costume de julgar todas as coisas pela medida de nossa própria existência."}, {"t": "l", "w": "M", "x": "É curioso... Consideramos passageiras as coisas que mudam diante de nossos olhos e eternas aquelas cujas mudanças não conseguimos acompanhar."}, {"t": "l", "w": "F", "x": "Mas o fato de não percebermos uma transformação não significa que ela não esteja acontecendo."}, {"t": "l", "w": "M", "x": "Então nem mesmo aquilo que parece mais permanente está necessariamente livre da passagem do tempo?"}, {"t": "l", "w": "F", "x": "Talvez não. A natureza transforma continuamente suas obras, embora algumas mudanças exijam períodos tão longos que ultrapassam nossa capacidade de observá-las."}, {"t": "l", "w": "M", "x": "Nesse caso, deveríamos ser mais cuidadosos ao afirmar que alguma coisa sempre foi ou sempre será da mesma maneira."}, {"t": "l", "w": "F", "x": "Eis uma excelente conclusão, madame! Afinal, conhecer os limites da nossa experiência talvez seja uma das primeiras condições para compreender o mundo."}, {"t": "i", "x": "Não confundir durabilidade aparente com eternidade; nosso tempo é uma escala limitada."}]}, {"t": "Uma última viagem: os cometas", "steps": [{"t": "l", "w": "M", "x": "E aquele viajante de longa cauda? Também faz parte de vossos mundos?"}, {"t": "l", "w": "F", "x": "Os cometas são visitantes bastante extraordinários, madame. Descartes imaginava que poderiam passar de um turbilhão celeste a outro."}, {"t": "l", "w": "M", "x": "Nesse caso, seus habitantes devem ser os maiores viajantes do Universo! Talvez, ao chegar a um novo mundo, gritem: “Novo Sol! Novo Sol!”, como os marinheiros gritam “Terra à vista!”."}, {"t": "l", "w": "F", "x": "Vejo que vossa imaginação já viaja mais depressa do que minhas explicações!"}]}, {"t": "Encerramento", "steps": [{"t": "l", "w": "M", "x": "Há cinco noites eu acreditava que a Terra permanecia imóvel no centro de tudo. Agora descubro que nosso Sol é apenas um entre incontáveis outros e que nem mesmo as estrelas são necessariamente eternas!"}, {"t": "l", "w": "F", "x": "Vedes, madame, quanto pode mudar nossa compreensão do Universo em tão pouco tempo?"}, {"t": "l", "w": "M", "x": "E pensar que tudo isso começou com uma simples conversa neste jardim!"}, {"t": "l", "w": "F", "x": "Mas ainda vos resta uma vantagem: podeis compreender minhas explicações sem ser obrigada a acreditar em todas elas."}, {"t": "l", "w": "M", "x": "Uma vantagem admirável! Depois de tantas descobertas, ainda conservo o direito de duvidar!"}, {"t": "l", "w": "F", "x": "E de continuar perguntando, madame. Talvez essa seja a parte mais importante de nossa viagem."}, {"t": "l", "w": "M", "x": "Nesse caso, receio que nossa conversa esteja longe de terminar."}]}]}, {"n": 6, "title": "O conhecimento nunca está terminado", "scenes": [{"t": "A marquesa agora é uma filósofa?", "steps": [{"t": "l", "w": "M", "x": "Ah, finalmente chegastes! Receio que vossas conversas tenham acabado por me arruinar a reputação!"}, {"t": "l", "w": "F", "x": "Que acusação terrível, madame! E que crime cometi desta vez?"}, {"t": "l", "w": "M", "x": "Acabo de receber dois cavalheiros. Quando lhes falei dos habitantes dos outros planetas, um deles pensou que eu estivesse brincando. O outro acreditou que eu falava seriamente — e pareceu considerar-me completamente louca!"}, {"t": "l", "w": "F", "x": "Então alcançastes uma posição admirável: sois considerada espirituosa quando não acreditam em vós e extravagante quando acreditam!"}, {"t": "l", "w": "M", "x": "E a culpa é toda vossa! Depois de cinco noites de explicações, julgava que seria capaz de convencer qualquer pessoa."}, {"t": "l", "w": "F", "x": "Ah, madame! Uma coisa é compreender um argumento. Outra é conseguir que alguém esteja disposto a examiná-lo."}, {"t": "l", "w": "M", "x": "Então não basta ter boas razões?"}, {"t": "l", "w": "F", "x": "Infelizmente, não. Nossos olhos e nossa imaginação frequentemente chegam a uma conclusão antes que a razão tenha oportunidade de falar."}, {"t": "l", "w": "M", "x": "E, no entanto, continuo convencida de que outros mundos podem ser habitados."}, {"t": "l", "w": "F", "x": "Podem, madame. Mas talvez devêssemos examinar com mais cuidado o quanto podemos estar certos disso."}]}, {"t": "O relógio da certeza", "steps": [{"t": "l", "w": "F", "x": "Imaginai dois relógios, madame. O primeiro indica as horas. O segundo, mais delicado, consegue indicar também os minutos."}, {"t": "l", "w": "M", "x": "Naturalmente, o segundo é mais preciso."}, {"t": "l", "w": "F", "x": "Assim acontece com nossos julgamentos. É fácil distinguir uma ideia absurda de uma certeza evidente. Mais difícil é perceber que, entre essas duas posições, existem muitos graus de confiança."}, {"t": "l", "w": "M", "x": "Então não devo colocar todas as minhas opiniões na mesma categoria?"}, {"t": "l", "w": "F", "x": "Exatamente! Podeis ter boas razões para considerar algo provável, sem que isso o torne absolutamente certo."}, {"t": "l", "w": "M", "x": "Começo a compreender. Mas receio que meu espírito precise de um relógio bastante sofisticado!"}, {"t": "ch", "id": "n6c1", "q": "O que o filósofo pretende demonstrar com a comparação entre os relógios?", "o": ["Uma ideia só pode ser considerada verdadeira quando temos certeza absoluta.", "Existem diferentes graus de certeza, e devemos aprender a distingui-los.", "Todas as opiniões têm exatamente o mesmo valor."], "a": 1, "e": "Assim como os relógios podem indicar o tempo com diferentes graus de precisão, nossas ideias também possuem diferentes graus de segurança. Podemos reconhecer que uma hipótese é plausível sem tratá-la como uma verdade demonstrada. O importante é avaliar cuidadosamente as razões que sustentam aquilo em que acreditamos."}, {"t": "l", "w": "M", "x": "Então uma pessoa pode estar profundamente convencida de alguma coisa e, ainda assim, não possuir razões suficientes para afirmá-la com certeza?"}, {"t": "l", "w": "F", "x": "Perfeitamente, madame. A intensidade com que acreditamos em uma ideia não aumenta necessariamente a força das provas que a sustentam."}, {"t": "l", "w": "M", "x": "Que pensamento inconveniente! Conheço pessoas que parecem acreditar que quanto mais alto falam, mais razão possuem!"}, {"t": "l", "w": "F", "x": "E talvez por isso seja tão difícil fazê-las ouvir."}, {"t": "l", "w": "M", "x": "Nesse caso, compreender uma ideia exige mais do que simplesmente defendê-la?"}, {"t": "l", "w": "F", "x": "Exige examinar suas razões, conhecer suas limitações e admitir aquilo que ainda não sabemos."}, {"t": "l", "w": "M", "x": "Parece-me que os homens aprenderiam muito se dedicassem menos tempo a vencer discussões e mais tempo a compreender seus argumentos."}, {"t": "i", "x": "Convicção pessoal e prova não são equivalentes."}]}, {"t": "A Terra também muda", "steps": [{"t": "l", "w": "M", "x": "Depois de tantos planetas e estrelas, imaginava que já não tivésseis mais nada a me revelar."}, {"t": "l", "w": "F", "x": "Ainda há muitas coisas que desconhecemos, mesmo na Terra. Dizei-me: que pensaríeis se encontrássemos conchas e restos de animais marinhos no alto de uma montanha, muito distante do mar?"}, {"t": "l", "w": "M", "x": "Imaginaria que alguém os tivesse levado até lá."}, {"t": "l", "w": "F", "x": "E se encontrássemos quantidades enormes desses vestígios, enterrados nas próprias rochas?"}, {"t": "l", "w": "M", "x": "Nesse caso... talvez aquele lugar nem sempre tenha sido uma montanha distante do mar!"}, {"t": "l", "w": "F", "x": "Precisamente! Há razões para pensar que regiões hoje secas estiveram cobertas pelas águas."}, {"t": "l", "w": "M", "x": "Então a própria Terra muda de aparência?"}, {"t": "l", "w": "F", "x": "Certamente. Os rios alteram seus caminhos, montanhas podem surgir ou desaparecer, e regiões inteiras podem transformar-se ao longo do tempo."}, {"t": "ch", "id": "n6c2", "q": "Por que o filósofo considera importante encontrar conchas marinhas em regiões montanhosas?", "o": ["Porque podem indicar que aquelas regiões estiveram cobertas pelo mar no passado.", "Porque demonstram que as montanhas sempre permaneceram iguais.", "Porque comprovam que as conchas se formam apenas em lugares elevados."], "a": 0, "e": "As conchas e os vestígios de animais marinhos encontrados nas rochas indicam que a história daquele lugar pode ter sido muito diferente de sua aparência atual. A Terra não permanece necessariamente igual ao longo dos séculos. Por isso, devemos investigar os sinais que a natureza deixou, em vez de acreditar que aquilo que vemos hoje sempre existiu da mesma maneira."}, {"t": "l", "w": "M", "x": "Que curioso! Podemos olhar para uma montanha e acreditar que ela sempre esteve ali, exatamente como a vemos."}, {"t": "l", "w": "F", "x": "Porque frequentemente confundimos a duração de nossa própria experiência com a duração das coisas."}, {"t": "l", "w": "M", "x": "Como as rosas da nossa conversa anterior, que poderiam imaginar o jardineiro eterno!"}, {"t": "l", "w": "F", "x": "Exatamente, madame. E agora as próprias montanhas nos recordam essa lição."}, {"t": "l", "w": "M", "x": "Então talvez estejamos sempre observando apenas um pequeno momento da história do mundo."}, {"t": "l", "w": "F", "x": "E quando esquecemos disso, corremos o risco de transformar nossa experiência limitada em uma verdade universal."}, {"t": "l", "w": "M", "x": "Parece-me que já não posso olhar nem para o céu, nem para uma montanha, sem desconfiar de que ambos guardam histórias que desconheço!"}, {"t": "l", "w": "F", "x": "Eis um excelente resultado de nossas conversas, madame."}, {"t": "i", "x": "O presente é um trecho da história do mundo, não sua totalidade."}]}, {"t": "As novas descobertas do céu", "steps": [{"t": "l", "w": "F", "x": "E não é apenas a Terra que apresenta mudanças. Os astrônomos também observaram alterações na aparência de Marte e Júpiter."}, {"t": "l", "w": "M", "x": "Então nossos mundos vizinhos também não permanecem sempre iguais?"}, {"t": "l", "w": "F", "x": "É o que as observações sugerem. Júpiter apresenta faixas que parecem mudar de forma e posição. Em Marte, também foram percebidas alterações que ainda não sabemos explicar corretamente."}, {"t": "l", "w": "M", "x": "E certamente já inventastes alguma explicação para tudo isso!"}, {"t": "l", "w": "F", "x": "Algumas, confesso. Mas talvez seja mais t": "ch", "id": "n6c3", "q": "O que Fontenelle pretende ensinar com a comparação entre filósofos e elefantes?", "o": ["Que os filósofos devem evitar qualquer conclusão sobre a natureza.", "Que devemos construir nossas conclusões cuidadosamente, verificando os argumentos antes de avançar.", "Que uma explicação deve ser aceita sempre que parece interessante."], "a": 1, "e": "Assim como o elefante procura firmar bem um pé antes de avançar com o outro, devemos apoiar nossas conclusões em razões que tenham sido examinadas. Uma descoberta pode sugerir muitas explicações, mas nem todas serão verdadeiras. O desejo de compreender a natureza não deve ser maior do que nosso cuidado em investigá-la."}, {"t": "l", "w": "M", "x": "Então talvez o maior desafio não seja encontrar explicações, mas aprender a reconhecer quais delas merecem nossa confiança."}, {"t": "l", "w": "F", "x": "Sem dúvida, madame. Nossa imaginação é extraordinariamente rápida. Ela nos apresenta possibilidades antes mesmo de examinarmos se são verdadeiras."}, {"t": "l", "w": "M", "x": "Mas não seria uma pena abandonar a imaginação? Afinal, foi graças a ela que visitamos tantos mundos!"}, {"t": "l", "w": "F", "x": "Não devemos abandoná-la. Sem imaginação, talvez jamais procurássemos aquilo que ainda não conhecemos. Mas, sem a razão, poderíamos acabar acreditando em todas as histórias que inventamos."}, {"t": "l", "w": "M", "x": "Então precisamos das duas: a imaginação para descobrir possibilidades e a razão para examiná-las."}, {"t": "l", "w": "F", "x": "Exatamente! Uma nos convida a explorar o desconhecido; a outra nos ajuda a não confundir nossos desejos com a realidade."}, {"t": "l", "w": "M", "x": "Parece-me que finalmente compreendi o espírito de todas as nossas conversas."}, {"t": "i", "x": "Imaginar possibilidades e investigá-las com razões verificadas são tarefas complementares."}]}, {"t": "Encerramento das seis noites", "steps": [{"t": "l", "w": "M", "x": "Lembrais-vos de nossa primeira conversa? Naque function drawModels(){
  const cv=document.getElementById('mcv');if(!cv)return;const c=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now();
  const ring=(x,y,r,col,w=2)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.arc(x,y,r,0,7);c.stroke()};
  const dot=(x,y,r,col)=>{c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill()};
  const frame=now=>{
    if(!document.getElementById('mcv'))return;
    const t=reduce?7:7+(now-t0)/1000;
    let k=0;if(S.f.cop)k=reduce?1:Math.min(1,(now-(S.f.copT||now))/2500);
    c.fillStyle='#070d1f';c.fillRect(0,0,1000,560);
    c.globalAlpha=1-.8*k;const ax=250,ay=300;
    [44,72,104,134,166].forEach(r=>ring(ax,ay,r,'rgba(163,200,236,.25)'));
    dot(ax,ay,13,'#4c9be0');const ma=t*1.3;dot(ax+44*Math.cos(ma),ay+44*Math.sin(ma),6,'#d9d4c4');
    const sa=t*.35;dot(ax+134*Math.cos(sa),ay+134*Math.sin(sa),14,'#f2c14e');
    const mp=u=>[ax+104*Math.cos(u*.2)+40*Math.cos(u*1.05),ay+104*Math.sin(u*.2)+40*Math.sin(u*1.05)];
    c.strokeStyle='rgba(227,112,79,.75)';c.lineWidth=3;c.beginPath();for(let s=0;s<=260;s++){const [x,y]=mp(t-s*.035);s?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();
    const [mx,my]=mp(t);dot(mx,my,8,'#e3704f');
    c.fillStyle='#ece6d3';c.font='400 64px "IM Fell English",Georgia,serif';c.fillText('A',40,90);
    c.globalAlpha=1;c.strokeStyle='rgba(163,200,236,.2)';c.lineWidth=2;c.beginPath();c.moveTo(500,40);c.lineTo(500,520);c.stroke();
    const bx=750,by=300;if(k>0)ring(bx,by,185,`rgba(240,208,138,${.8*k})`,5);
    ring(bx,by,86,'rgba(163,200,236,.3)');ring(bx,by,140,'rgba(163,200,236,.3)');
    c.fillStyle='rgba(242,193,78,.25)';c.beginPath();c.arc(bx,by,30,0,7);c.fill();dot(bx,by,18,'#f2c14e');
    const ea=t*.6,ex=bx+86*Math.cos(ea),ey=by+86*Math.sin(ea);dot(ex,ey,9,'#4c9be0');dot(ex+18*Math.cos(t*3),ey+18*Math.sin(t*3),4,'#d9d4c4');
    const ra=t*.32;dot(bx+140*Math.cos(ra),by+140*Math.sin(ra),8,'#e3704f');
    c.fillStyle='#ece6d3';c.fillText('B',540,90);
    if(!reduce||!S.f.cop||k<1)raf=requestAnimationFrame(frame);
  };
  raf=requestAnimationFrame(frame);
}

/* ---------- regras de avanço ---------- */
function blocked(st){
  if(!st)return false;
  if(st.t==='do')return !S.f[st.k];
  if(st.t==='g')return st.need?!st.need.every(k=>S.f[k]):!(S.f.vin&&S.f.vout);
  if(st.t==='ch')return S.ans[st.id]==null;
  return false;
}
function hintFor(st){
  if(st.t==='do')return `Toque em “${st.label}” para continuar.`;
  if(st.t==='g')return st.x;
  if(st.t==='ch')return 'Escolha uma alternativa para continuar.';
  return '';
}

function chalNum(id){return DATA[S.night].scenes.flatMap(s=>s.steps).filter(x=>x.t==='ch').findIndex(x=>x.id===id)+1}
function chalHtml(st){const a=S.ans[st.id],n=chalNum(st.id);
  return `<section class="chal" aria-label="Desafio ${n}"><span class="eyebrow">Desafio ${n} de 3</span><h3>${st.q}</h3>
  <div class="opts">${st.o.map((o,i)=>`<button class="opt ${a===i?'pick':''}" ${a!=null?'disabled':''} onclick="answer('${st.id}',${i})"><span>${LET[i]})</span>${o}</button>`).join('')}</div>
  ${a!=null?`<p class="verdict">Sua escolha: ${LET[a]} · Resposta de referência: ${LET[st.a]}</p><div class="expl"><b>Explicação do filósofo</b><p>${st.e}</p></div><div><button class="btn" onclick="advance()">Continuar</button></div>`:''}</section>`}
function bandHtml(sc,st,b,label){
  let c='';const prev=sc.steps[S.i-1];
  if(st.t==='l')c=`<span class="who ${st.w}">${st.w==='M'?'Marquesa':'Filósofo'}</span><p class="txt">${st.x}</p>`;
  else if(st.t==='n')c=`<p class="txt cap">${st.x}</p>`;
  else if(st.t==='q')c=`<span class="who Q">Passagem da obra</span><p class="txt qt">“${st.x}”</p><cite>${st.src}</cite>`;
  else if(st.t==='do')c=S.f[st.k]?`<p class="txt cap">${st.done}</p>`:`${prev&&prev.t==='l'?`<span class="who ${prev.w}">${prev.w==='M'?'Marquesa':'Filósofo'}</span><p class="prev">${prev.x}</p>`:''}<button class="act" onclick="doIt('${st.k}')">${st.label}</button>`;
  else if(st.t==='g')c=st.need?`<p class="txt cap">${blocked(st)?st.x:st.done}</p>`:`<p class="txt cap">${(S.f.vin&&S.f.vout)?'Você viu o barco de dentro e das margens.':'Use os botões no alto da cena: olhe o barco de dentro e das margens.'}</p>`;
  else if(st.t==='i')c=`<span class="who Q">${st.lab||'Ideia central'}</span><p class="txt">${st.x}</p>`;
  else if(st.t==='ch')c=`<p class="txt cap">Responda ao desafio.</p>`;
  return `<div class="band"><div class="bc" aria-live="polite">${c}</div><button class="btn" id="next" ${b?'disabled':''} onclick="advance()">${label}</button></div>`;
}
function ovlFor(sc){

  if(sc.tog){const t=sc.tog;return `<div class="seg">${t.opts.map(([v,l])=>`<button aria-pressed="${S.f[t.k]===v}" onclick="setTog('${t.k}','${v}')">${l}</button>`).join('')}</div>`}

  return '';
}

  <div class="row"><button class="btn" onclick="go('menu')">Voltar às noites</button><button class="btn ghost" onclick="startNight(${N.n})">Rever esta noite</button>${N.next?'':`<button class="btn ghost" onclick="go('closing')">Encerramento da viagem</button>`}</div></div></div></div>${ROT}`;
}

/* ---------- motor ---------- */
function closingView(){
  return `<div class="frame"><div class="sl"><div class="bg dim">${bgGarden()}</div><div class="pg" style="justify-content:center">
  <span class="eyebrow">Uma viagem que continua</span><h1>${SCRIPT.closing[0]}</h1>
  <div class="fin">${SCRIPT.closing.slice(1).map(p=>`<p>${p}</p>`).join('')}</div>
  <p class="eyebrow" style="font-size:.95em">A viagem termina aqui. A curiosidade, não.</p><p class="by">Criação e roteiro: <b>Fabiane Colaço Ferreira</b> · Filosofia · UFPR · 2026</p>
  <div class="row">${AUDIO.final?`<button class="btn" onclick="playClosing()">${closingOn?'Pausar a narração':'▶ Ouvir o encerramento'}</button>`:''}<button class="btn ghost" onclick="go('menu')">Voltar às noites</button></div></div></div></div>${ROT}`;
}
let closingA=null,closingOn=false;
function playClosing(){if(closingOn){try{closingA.pause()}catch(e){}closingOn=false;go(null,true);return}try{closingA=closingA||new Audio(AUDIO.final);closingA.playbackRate=RATE();closingA.onended=()=>{closingOn=false;go(null,true)};closingA.play().then(()=>{closingOn=true;go(null,true)}).catch(()=>{})}catch(e){}}
const VIEWS={open:openView,menu:menuView,night:nightView,end:endView,closing:closingView};
function go(v,keepScroll){
  if(v)S.view=v;
  if(S.view!=='night')stopVoice();
  if(S.view!=='open')stopIntro();
  if(S.view!=='closing'&&closingA){try{closingA.pause()}catch(e){}closingOn=false}
  const prevStage=S.view==='night'?document.getElementById('stage'):null;
  const keep=prevStage&&prevStage.firstElementChild?prevStage.firstElementChild:null;
  app.innerHTML=VIEWS[S.view]();
  if(S.view==='night'){
    const sc=DATA[S.night].scenes[S.sc],st=stageFor(sc),el=document.getElementById('stage');
    if(keep&&st.key===stageKey){el.appendChild(keep)}
    else{if(raf)cancelAnimationFrame(raf);raf=null;el.innerHTML=st.html;stageKey=st.key;st.after&&st.after()}
  }else{if(raf)cancelAnimationFrame(raf);raf=null;stageKey=''}
  if(!keepScroll)window.scrollTo(0,0);
  if(v==='closing'&&!closingOn&&AUDIO.final)setTimeout(()=>{if(S.view==='closing'&&!closingOn)playClosing()},500);
  if(v==='end'&&!DATA[S.night].next)setTimeout(()=>{if(S.view==='end')go('closing')},6000);
}
function scrollNewest(){const l=document.querySelector('#log>:last-child');l&&l.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function startNight(n){S.night=n;S.sc=0;S.i=0;S.f={};S.ans={};stageKey='';go('night');playStep(DATA[n].scenes[0].steps[0])}
function advance(){
  const N=DATA[S.night],sc=N.scenes[S.sc];
  if(blocked(sc.steps[S.i]))return;
  if(S.i<sc.steps.length-1){S.i++;go(null,true);scrollNewest();playStep(sc.steps[S.i]);return}
  if(S.sc<N.scenes.length-1){S.sc++;S.i=0;go();playStep(N.scenes[S.sc].steps[0]);return}
  stopVoice();
  const chs=N.scenes.flatMap(s=>s.steps).filter(x=>x.t==='ch');const sc2=loadScores();
  sc2[N.n]={score:chs.filter(c=>S.ans[c.id]===c.a).length,total:chs.length};saveScores(sc2);go('end');
}
function doIt(k){S.f[k]=true;go(null,true);if(k==='moon'){playStep(DATA[S.night].scenes[S.sc].steps[S.i]);return}advance()}
function answer(id,i){S.ans[id]=i;const st=DATA[S.night].scenes.flatMap(s=>s.steps).find(x=>x.id===id);if(st.set){S.f[st.set]=true;S.f[st.set+'T']=performance.now()}go(null,true);play(st.eaid);const c=document.querySelector('.chal .expl');c&&c.scrollIntoView({block:'nearest'})}
function setTog(k,v){S.f[k]=v;S.f[k+'_'+v]=true;go(null,true);const st=DATA[S.night].scenes[S.sc].steps[S.i];if(st.t==='g'&&!blocked(st)&&!S.paused){clearTimeout(autoT);autoT=setTimeout(autoNext,2500)}}
function setView(v){S.f.view=v;S.f['v'+v]=true;go(null,true);const st=DATA[S.night].scenes[S.sc].steps[S.i];if(st.t==='g'&&!blocked(st)){clearTimeout(autoT);autoT=setTimeout(autoNext,2500)}}

function start(d){S=d&&d.view?d:fresh();stageKey='';go(null,true);if(S.view==='open'&&!introOn)toggleIntro()}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
